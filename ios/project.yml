# XcodeGen spec. The .xcodeproj is GENERATED from this file and is not in git —
# a pbxproj is a merge-conflict machine that nobody can review, and this is the
# same file in a form a person can read.
#
#   cd ios && xcodegen generate && open WorkTrack.xcodeproj
#
name: WorkTrack
options:
  bundleIdPrefix: app.worktrack
  deploymentTarget:
    iOS: "16.0"          # iPhone 8 and later — secondhand phones matter here
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    # No Developer ID yet, so device builds have nothing to sign with. But
    # simulator builds must still be signed ad-hoc ("-"): the Keychain refuses
    # an app with no entitlements, and SecItemAdd fails with -34018. Turning
    # signing off wholesale made every launch ask for the password again,
    # silently, because nothing checked the status.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual

targets:
  WorkTrack:
    type: application
    platform: iOS
    sources:
      - path: WorkTrack
    info:
      path: WorkTrack/Info.plist
      properties:
        CFBundleDisplayName: WorkTrack
        UILaunchScreen: {}
        # Dari first, exactly like the portal and the Android app. Without this
        # the app inherits the phone's language and an Afghan user with an
        # English phone gets an English, left-to-right layout.
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa, ps, en]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Asked for at the moment somebody punches, and only then. There is no
        # background tracking in this app and no plan for any, so "when in use"
        # is the whole claim.
        NSLocationWhenInUseUsageDescription: "برای ثبت حاضری، موقعیت شما یک بار در همان لحظه خوانده می‌شود تا معلوم شود در ساحهٔ کاری هستید."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.worktrack
        GENERATE_INFOPLIST_FILE: NO

  WorkTrackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WorkTrackTests
    settings:
      base:
        # The test bundle is signed too now, so it needs its own Info.plist;
        # let Xcode generate one rather than hand-keeping a second file.
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.worktrack.tests
    dependencies:
      - target: WorkTrack
